[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tonk-pollen"
version = "0.1.0"
description = "Coding agents' work, drawn as a garden in a Tonk space"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.scripts]
pollen = "tonk_pollen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
